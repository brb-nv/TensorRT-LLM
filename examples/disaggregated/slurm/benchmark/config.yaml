# SLURM Configuration
slurm:
  script_file: "disaggr_torch.slurm"
  partition: "gb300"
  account: "coreai_comparch_trtllm"
  job_time: "01:00:00"
  job_name: "m3_gen_only"
  extra_args: ""
  set_segment: true
  numa_bind: true

# Benchmark Mode
benchmark:
  mode: "e2e"  # Options: e2e, gen_only, gen_only_no_context
  use_nv_sa_benchmark: false
  multi_round: 8
  benchmark_ratio: 1.0
  streaming: true
  concurrency_list: "256"
  input_length: 8192
  output_length: 1024
  dataset_file: "/lustre/fsw/coreai_comparch_trtllm/bbuddharaju/datasets/minimax-m3-fp4-8192-1024-2048-ratio-1_for_serve.json"

# Hardware Configuration
hardware:
  gpus_per_node: 4
  num_ctx_servers: 1
  num_gen_servers: 1

# Environment Configuration
environment:
  container_mount: "/lustre:/lustre,/project:/project"
  container_image: "/lustre/fsw/coreai_comparch_trtllm/bbuddharaju/sqsh/tensorrt_llm_pytorch_26.05_py3_sbsa_ubuntu24.04_skip_tritondevel_202607211045_16608.sqsh"
  model_path: "/lustre/share/coreai_dlalgo_ci/artifacts/model/nvidia_minimax-m3-nvfp4/hf/hf-9014640_orig"
  trtllm_repo: "/lustre/fsw/coreai_comparch_trtllm/bbuddharaju/TensorRT-LLM_Minimax"
  build_wheel: true
  cuda_architectures: "100-real;103-real"
  # trtllm_wheel_path: "/lustre/fsw/coreai_comparch_trtllm/bbuddharaju/TensorRT-LLM_Minimax/build/tensorrt_llm-1.3.0rc23-cp312-cp312-linux_aarch64.whl"
  trtllm_wheel_path: ""
  work_dir: "/lustre/fsw/coreai_comparch_trtllm/bbuddharaju/TensorRT-LLM_Minimax/examples/disaggregated/slurm/benchmark"
  worker_env_var: "TLLM_KV_CACHE_MANAGER_V2_MEM_TRACE=1 TLLM_LOG_LEVEL=INFO TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_WORKER_DISABLE_GC=1 TRTLLM_ENABLE_PDL=1 ENROOT_ALLOW_DEV=yes NCCL_GRAPH_MIXING_SUPPORT=0 MIMALLOC_PURGE_DELAY=0 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 TQDM_DISABLE=1 HF_HUB_DISABLE_PROGRESS_BARS=1 TRTLLM_KV_CACHE_TRANSFER_TIMEOUT_SEC=600 TRTLLM_KV_TRANSFER_NUM_THREADS=4 UCX_TLS=cuda_copy,cuda_ipc,sm,self,tcp"
  server_env_var: "TRTLLM_SERVER_DISABLE_GC=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1"
  # gen_only mode forces TRTLLM_DISABLE_KV_CACHE_TRANSFER_OVERLAP=1 into
  # worker_env_var; the role-scoped vars are applied last, so overlapped
  # (async) KV transfer has to be requested here to survive that.
  #
  # TRTLLM_ADP_DUMMY_FAIL_* drives the scratch-branch fault injector in
  # MiniMaxM3KVCacheManagerV2.add_dummy_requests: rank 3 refuses the attention
  # DP pad dummy 50 times, starting 180s in so warmup is clear, then recovers.
  # Drop these three vars when running without that branch.
  ctx_worker_env_var: "TRTLLM_DISABLE_KV_CACHE_TRANSFER_OVERLAP=0 TRTLLM_ADP_DUMMY_FAIL_RANKS=3 TRTLLM_ADP_DUMMY_FAIL_COUNT=50 TRTLLM_ADP_DUMMY_FAIL_AFTER_SEC=180"
  gen_worker_env_var: "TRTLLM_DISABLE_KV_CACHE_TRANSFER_OVERLAP=0"

# Profiling Configuration
profiling:
  nsys_on: false
  ctx_profile_range: "10-30"
  gen_profile_range: "200-250"

# Accuracy Configuration
accuracy:
  enable_accuracy_test: false
  tasks:
    gsm8k:
      model: "local-completions"
      model_args_extra: "num_concurrent=512,max_retries=3,tokenized_requests=false,timeout=7200,max_gen_toks=16384"
      extra_kwargs:
        trust_remote_code: true

worker_config:
  gen:
    tensor_parallel_size: 4
    moe_expert_parallel_size: 4
    enable_attention_dp: true
    pipeline_parallel_size: 1
    context_parallel_size: 1
    max_batch_size: 64
    max_num_tokens: 256  # max_batch_size * (1 + max_draft_len)
    max_seq_len: 9320
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 64
    print_iter_log: true
    trust_remote_code: true
    scheduler_config:
      capacity_scheduler_policy: MAX_UTILIZATION
    kv_cache_config:
      enable_block_reuse: false
      tokens_per_block: 128
      free_gpu_memory_fraction: 0.8
      dtype: fp8
      use_kv_cache_manager_v2: true
      host_cache_size: 206158430208  # 192 GiB per rank
    sparse_attention_config:
      algorithm: minimax_m3
      implementation: msa
      indexer_kv_dtype: fp8
      fuse_qkv_index_projection: true
    speculative_config:
      decoding_type: Eagle3
      max_draft_len: 3
      speculative_model_dir: /lustre/fsw/coreai_comparch_trtllm/bbuddharaju/minimax_m3_kv_offload/inputs/minimax-m3-eagle3-gqa
    moe_config:
      backend: TRTLLM
    cache_transceiver_config:
      backend: NIXL
      kv_cache_bounce_size_mb: 0
      kv_transfer_timeout_ms: 600000
      transceiver_runtime: PYTHON
    stream_interval: 20
    num_postprocess_workers: 4
  ctx:
    tensor_parallel_size: 4
    moe_expert_parallel_size: 4
    enable_attention_dp: true
    pipeline_parallel_size: 1
    context_parallel_size: 1
    max_batch_size: 4
    max_num_tokens: 8320
    max_seq_len: 8320
    enable_chunked_prefill: true
    disable_overlap_scheduler: true
    cuda_graph_config: null
    print_iter_log: true
    trust_remote_code: true
    scheduler_config:
      capacity_scheduler_policy: MAX_UTILIZATION
    kv_cache_config:
      enable_block_reuse: false
      tokens_per_block: 128
      free_gpu_memory_fraction: 0.6
      dtype: fp8
      use_kv_cache_manager_v2: true
      host_cache_size: 206158430208  # 192 GiB per rank
    sparse_attention_config:
      algorithm: minimax_m3
      implementation: msa
      indexer_kv_dtype: fp8
      fuse_qkv_index_projection: true
    speculative_config:
      decoding_type: Eagle3
      max_draft_len: 3
      speculative_model_dir: /lustre/fsw/coreai_comparch_trtllm/bbuddharaju/minimax_m3_kv_offload/inputs/minimax-m3-eagle3-gqa
    moe_config:
      backend: TRTLLM
    cache_transceiver_config:
      backend: NIXL
      kv_cache_bounce_size_mb: 0
      kv_transfer_timeout_ms: 600000
      transceiver_runtime: PYTHON
